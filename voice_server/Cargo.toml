[package]
name = "voice_server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1.32", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
hound = "3.5.1"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
vosk = { version = "0.3.1", optional = true }

[features]
default = ["vosk-stt"]
# Выключите (--no-default-features), если нет нативной библиотеки libvosk —
# тогда STT работает в mock-режиме для тестирования пайплайна без модели.
vosk-stt = ["dep:vosk"]
